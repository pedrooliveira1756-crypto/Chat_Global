databases:
  - name: chat-realtime-db
    plan: free
    databaseName: chat_realtime
    user: chat_realtime

services:
  - type: web
    name: chat-realtime-api
    runtime: python
    plan: free
    rootDir: back-end
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /chat/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chat-realtime-db
          property: connectionString
